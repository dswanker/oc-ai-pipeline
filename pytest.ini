[pytest]
testpaths = tests
# pytest's default norecursedirs contains 'build', which silently skipped tests/build
# under `pytest tests`. Override it (without 'build') so plain `pytest` runs everything.
norecursedirs = .* *.egg dist node_modules venv __pycache__ CVS _darcs {arch}
addopts = -q --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
